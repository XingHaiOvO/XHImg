name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  publish:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve image metadata
        id: image
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) version=latest ;;
            refs/tags/*) version="${GITHUB_REF#refs/tags/}" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "reference=ghcr.io/${GITHUB_REPOSITORY,,}:$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify both architectures
        run: |
          for arch in amd64 arm64; do
            image="xhimg-smoke:$arch"
            docker buildx build --platform "linux/$arch" --load --tag "$image" .
            container="$(docker run --detach --platform "linux/$arch" \
              --env "MASTER_KEY=$(openssl rand -hex 32)" \
              --mount type=volume,target=/app/data "$image")"
            trap 'docker rm --force --volumes "$container" >/dev/null' EXIT

            ready=false
            for attempt in {1..30}; do
              if docker exec "$container" node -e 'fetch("http://127.0.0.1:9521/health").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'; then
                ready=true
                break
              fi
              if [[ "$(docker inspect --format '{{.State.Running}}' "$container")" != true ]]; then
                break
              fi
              sleep 2
            done
            if [[ "$ready" != true ]]; then
              echo "::error::XHImg $arch did not start or pass /health"
              exit 1
            fi

            docker exec "$container" test -s /app/data/xhimg.sqlite
            docker exec "$container" ffmpeg -version
            docker exec "$container" ffprobe -version
            docker rm --force --volumes "$container" >/dev/null
            trap - EXIT
          done

      - name: Confirm publication ref
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.image.outputs.revision }}
        run: |
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            if [[ "$head" != "$REVISION" ]]; then
              echo "::notice::Skipping latest because main has moved to $head"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Sign in to GitHub Container Registry
        if: steps.current.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.reference }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
